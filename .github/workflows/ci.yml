name: Hilo CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev
      - name: Docker dependency manifest matches lockfile
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project --no-header --format requirements-txt --output-file /tmp/hilo-requirements.txt
          diff -u requirements.txt /tmp/hilo-requirements.txt
      - name: Framework regressions
        run: make test
      - name: Publication inputs
        run: python3 scripts/export_open_source.py --check
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm typecheck
        working-directory: frontend
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable stack
        run: |
          python3 scripts/init_config.py --example technical-docs
          python3 backend/tests/stack_smoke.py --prepare
      - name: Build and start Hilo
        run: docker compose -p hilo-smoke -f docker/compose.hilo.yaml -f docker/compose.smoke.yaml up --build -d
      - name: Index synthetic sources
        run: |
          docker compose -p hilo-smoke -f docker/compose.hilo.yaml -f docker/compose.smoke.yaml exec -T gateway python -m src.community.knowledge_base.indexer
      - name: Full-stack HTTP acceptance
        run: python3 backend/tests/stack_smoke.py --state-file /tmp/hilo-smoke-state.json
      - name: Lifecycle and scope acceptance
        run: python3 backend/tests/stack_lifecycle.py --phase before --state-file /tmp/hilo-smoke-state.json
      - name: Recreate containers while retaining data volumes
        run: |
          docker compose -p hilo-smoke -f docker/compose.hilo.yaml -f docker/compose.smoke.yaml down
          docker compose -p hilo-smoke -f docker/compose.hilo.yaml -f docker/compose.smoke.yaml up -d
      - name: Persistent data after restart
        run: python3 backend/tests/stack_lifecycle.py --phase after --state-file /tmp/hilo-smoke-state.json
      - name: Installed Skills visible to agent process
        run: |
          docker compose -p hilo-smoke -f docker/compose.hilo.yaml -f docker/compose.smoke.yaml exec -T langgraph python -c "from src.skills import load_skills; assert any(s.name == 'hilo-smoke' for s in load_skills())"
      - name: Stack diagnostics
        if: failure()
        run: docker compose -p hilo-smoke -f docker/compose.hilo.yaml -f docker/compose.smoke.yaml logs --tail=120
      - name: Remove disposable stack
        if: always()
        run: |
          docker compose -p hilo-smoke -f docker/compose.hilo.yaml -f docker/compose.smoke.yaml down -v
          rm -f /tmp/hilo-smoke-state.json
