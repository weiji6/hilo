name: Hilo CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev
      - name: Docker dependency manifest matches lockfile
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project --no-header --format requirements-txt --output-file /tmp/hilo-requirements.txt
          diff -u requirements.txt /tmp/hilo-requirements.txt
      - name: Framework regressions
        run: make test
      - name: Publication inputs
        run: python3 scripts/export_open_source.py --check
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm typecheck
        working-directory: frontend
