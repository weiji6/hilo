name: hilo

x-backend: &backend
  build:
    context: ..
    dockerfile: backend/Dockerfile
  env_file: ../backend/.env
  environment:
    HILO_CONFIG_PATH: /app/config.yaml
    HILO_EXTENSIONS_CONFIG_PATH: /app/extensions_config.json
    HILO_HOME: /app/backend/.deer-flow
    QDRANT_URL: http://qdrant:6333
    TASK_MEMORY_ENABLED: "false"
  volumes:
    - ../config.yaml:/app/config.yaml:ro
    - ../examples:/app/examples:ro
    - ../extensions_config.json:/app/extensions_config.json
    - ../skills/public:/app/skills/public:ro
    - custom-skills:/app/skills/custom
    - ../knowledge:/app/knowledge
    - hilo-data:/app/backend/.deer-flow
  working_dir: /app/backend
  depends_on:
    qdrant:
      condition: service_healthy

services:
  qdrant:
    image: qdrant/qdrant:v1.17.0
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The Qdrant image includes Bash but does not include curl or wget.
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333;
          printf 'GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          read -r status <&3;
          [[ "$$status" == HTTP/*" 200 "* ]]
      interval: 5s
      timeout: 4s
      start_period: 10s
      retries: 20

  mysql:
    image: mariadb:10.11
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: hilo
      MARIADB_USER: hilo
      MARIADB_PASSWORD: hilo-local-dev
    volumes:
      - auth-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  gateway:
    <<: *backend
    command: ["python", "-m", "uvicorn", "src.gateway.app:app", "--host", "0.0.0.0", "--port", "8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=4)"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 30

  langgraph:
    <<: *backend
    command: ["langgraph", "dev", "--no-browser", "--allow-blocking", "--no-reload", "--host", "0.0.0.0", "--port", "2024"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2024/ok', timeout=4)"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 30
    volumes:
      - ../config.yaml:/app/config.yaml:ro
      - ../examples:/app/examples:ro
      - ../extensions_config.json:/app/extensions_config.json
      - ../skills/public:/app/skills/public:ro
      - custom-skills:/app/skills/custom
      - ../knowledge:/app/knowledge
      - hilo-data:/app/backend/.deer-flow
      - checkpoints:/app/backend/.langgraph_api

  auth-migrate:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    env_file: ../frontend/.env
    environment:
      DATABASE_URL: mysql://hilo:hilo-local-dev@mysql:3306/hilo
    command: ["sh", "-c", "cd frontend && pnpm auth:migrate"]
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    env_file: ../frontend/.env
    environment:
      DATABASE_URL: mysql://hilo:hilo-local-dev@mysql:3306/hilo
      BACKEND_BASE_URL: http://gateway:8001
      LANGGRAPH_BASE_URL: http://langgraph:2024
    command: ["sh", "-c", "cd frontend && pnpm dev --hostname 0.0.0.0"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/auth/get-session').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 10s
      start_period: 30s
      retries: 30
    depends_on:
      auth-migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:2026:2026"
    volumes:
      - ./nginx/hilo.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2026/api/auth/get-session"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      frontend:
        condition: service_healthy
      gateway:
        condition: service_healthy
      langgraph:
        condition: service_healthy

volumes:
  hilo-data:
  qdrant-data:
  auth-data:
  checkpoints:
  custom-skills:
