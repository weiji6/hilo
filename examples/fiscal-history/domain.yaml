name: fiscal-history
instructions: |
  你正在研究财政历史。先界定问题的时空范围，再分析分期、制度、机制、因果与转折。
  民国财政概况应核实北洋、南京前期、抗战与战后各期，不能从前期材料推断战后情况。
  “整理方案”只证明提出计划，不能证明已实施。引用作者评价时说明其立场。
  统计数据保留时期、币种、分母和估算限定；比较前说明口径是否一致。
query_aliases:
  清代末期: [晚清, 清末]
  晚清: [清代末期, 清末]
  清末: [晚清, 清代末期]
  民国时期: [民国]
  民国: [民国时期]
query_suffixes: [史料记载, 事件经过, 背景影响]
query_facets:
  民国: [南京临时政府, 北洋政府, 南京国民政府, 抗日战争时期, 解放战争时期]
  晚清: [同治时期, 光绪时期, 清末新政, 宣统时期, 预备立宪]
  北洋时期: [袁世凯时期, 皖系时期, 直系时期, 奉系时期]
rewrite_rules:
  - pattern: '财政(?:情况|概况|变化|变迁|问题|状况|体制|制度)?'
    replacements: [财政收入结构, 财政支出结构, 财政政策]
    when_contains: [情况, 概况, 变化, 变迁, 问题, 状况]
